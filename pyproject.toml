[project]
name = "keepa-mcp"
version = "0.1.0"
description = "Keepa product-research MCP server: search Amazon products via the Keepa API, pull decision metrics, and generate XLSX purchase-analysis reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "keepa>=1.3.13",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.24",
]

[project.scripts]
keepa-mcp = "keepa_mcp.server:main"
keepa-auto = "keepa_mcp.auto_search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepa_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
